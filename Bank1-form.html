<script>  
 // Firebase Configuration
 const firebaseConfig = {
   apiKey: "AIzaSyDSgVvCuMiGzjwNB1mM2FdjTqOCB9vPNZM",
   authDomain: "bank-pro-1b6af.firebaseapp.com",
   projectId: "bank-pro-1b6af",
   storageBucket: "bank-pro-1b6af.firebasestorage.app",
   messagingSenderId: "618421401325",
   appId: "1:618421401325:web:67cc5c08b6f4dc47ea3ee4"
 };

 if (!firebase.apps.length) {
   firebase.initializeApp(firebaseConfig);
 }
 const auth = firebase.auth();
 const db = firebase.firestore();

 let currentCloudUser = null;
 auth.onAuthStateChanged((user) => {
   currentCloudUser = user;
   updateAuthUI(user);
 });

 function promptOpenCloudBox() {
   const box = document.getElementById('authBoxContainer');
   if (box.style.display === 'block') {
     box.style.display = 'none';
     return;
   }
   if (currentCloudUser) {
     pendingAction = "cloud_settings";
     setupModal("CLOUD SECURITY", "#00f3ff", "OPEN");
   } else {
     box.style.display = 'block';
   }
 }

 function updateAuthUI(user) {
   const statusDiv = document.getElementById('cloudUserStatus');
   const inputsDiv = document.getElementById('authInputs');
   const logoutBtn = document.getElementById('logoutBtn');
   const box = document.getElementById('authBoxContainer');

   if (user) {
     statusDiv.innerHTML = `✅ लॉग-इन: <span style="color:#00f3ff;">${user.email}</span>`;
     inputsDiv.style.display = 'none';
     logoutBtn.style.display = 'block';
     box.style.display = 'none'; 
   } else {
     statusDiv.innerText = 'स्थिति: लॉग-इन नहीं हैं';
     inputsDiv.style.display = 'block';
     logoutBtn.style.display = 'none';
   }
 }

 async function handleCloudAuth(type) {
   const email = document.getElementById('cloudEmail').value.trim();
   const pass = document.getElementById('cloudPass').value.trim();
   if (!email || !pass) {
     showCustomDialog("चेतावनी", "कृपया ईमेल और पासवर्ड दोनों दर्ज करें!", false);
     return;
   }
   if (pass.length < 6) {
     showCustomDialog("चेतावनी", "पासवर्ड कम से कम 6 अक्षरों का होना चाहिए!", false);
     return;
   }
   try {
     if (type === 'signup') {
       await auth.createUserWithEmailAndPassword(email, pass);
       showCustomDialog("सफलता", "✅ नया खाता बन गया और आप लॉग-इन हो गए!", false);
     } else {
       await auth.signInWithEmailAndPassword(email, pass);
       showCustomDialog("सफलता", "✅ सफलतापूर्वक लॉग-इन हो गया!", false);
     }
     document.getElementById('cloudEmail').value = '';
     document.getElementById('cloudPass').value = '';
   } catch (err) {
     showCustomDialog("एरर", "❌ " + err.message, false);
   }
 }

 async function handleCloudSignOut() {
   await auth.signOut();
   showCustomDialog("लॉगआउट", "खाता लॉगआउट हो गया!", false);
 }

 async function syncToCloud(show) {
   if (!currentCloudUser) {
     if (show) showCustomDialog("लॉगिन आवश्यक", "⚠️ पहले सेटिंग्स में जाकर अपना ईमेल लॉगिन या साइन-अप करें!", false);
     return;
   }
   const fullBackup = {
     mainData: JSON.parse(localStorage.getItem('BankProData') || '[]'),
     trashData: JSON.parse(localStorage.getItem('BankPro_Trash') || '[]'),
     updatedAt: Date.now()
   };
   try {
     await db.collection("users").doc(currentCloudUser.uid).set(fullBackup);
     if (show) showCustomDialog("सफलता", "☁️ आपका डेटा क्लाउड सर्वर पर सुरक्षित हो गया!", false);
   } catch (e) {
     if (show) showCustomDialog("एरर", "❌ सिंक विफल: " + e.message, false);
   }
 }

 async function restoreFromCloud() {
   if (!currentCloudUser) {
     showCustomDialog("लॉगिन आवश्यक", "⚠️ पहले सेटिंग्स में जाकर अपना ईमेल लॉगिन करें!", false);
     return;
   }

 let isExpBackspacing = false;  
 function handleExpKeyDown(e, index) {  
   if (e.key === 'Enter') {  
     handleEnter(e, index);  
     return;  
   }  
   if (e.key === 'Backspace') {  
     isExpBackspacing = true;  
     let inp = e.target;  
     let val = inp.value;  
     if (val.length === 3 && val.endsWith('/')) {  
       e.preventDefault();  
       inp.value = val.substring(0, 1);  
     }  
   } else {  
     isExpBackspacing = false;  
   }  
 }  
  
 function handleExpInput(el) {  
   if (isExpBackspacing) return;  
   let v = el.value.replace(/\D/g, '');  
   if (v.length > 4) v = v.substring(0, 4);  
     
   if (v.length >= 2) {  
     el.value = v.substring(0, 2) + '/' + v.substring(2);  
   } else {  
     el.value = v;  
   }  
 }

 function handleEnter(e, index) {  
   if (e.key === 'Enter') {  
     e.preventDefault();  
     const nextField = fieldConfig[index + 1];  
     if (nextField) {  
       let nextEl = document.getElementById('inp-' + nextField[1]);  
       if (nextField[1] === 'cvv') {  
         nextEl = document.getElementById('inp-cvv-code');  
       }  
       if (nextEl) {  
         nextEl.focus();  
         if (nextEl.tagName !== 'TEXTAREA' && nextEl.tagName !== 'INPUT') {  
           const range = document.createRange();   
           const sel = window.getSelection();  
           range.selectNodeContents(nextEl);   
           range.collapse(false);  
           sel.removeAllRanges();   
           sel.addRange(range);  
         } else if (nextEl.tagName === 'INPUT') {  
           nextEl.selectionStart = nextEl.selectionEnd = nextEl.value.length;  
         } else {   
           nextEl.selectionStart = nextEl.selectionEnd = nextEl.value.length;   
         }  
       }  
     }  
   }  
 }

 function parseOCRResult(text) {  
   const okBtn = document.getElementById('dialogOkBtn');  
   try {  
     if (activeScanTarget === 'pan') {  
       let cleanPanText = text.toUpperCase().replace(/[^A-Z0-9\n ]/g, ' ');  
       let panCandidate = cleanPanText.match(/[A-Z0-9]{5}\s*[0-9OIS]{4}\s*[A-Z0-9]{1}/);  
       let foundPan = "";  
         
       if (panCandidate) {  
         let p = panCandidate[0].replace(/\s+/g, '');  
         foundPan = p.substring(0, 5) +   
         p.substring(5, 9).replace(/O/g, '0').replace(/I/g, '1').replace(/S/g, '5') +   
         p.substring(9, 10);  
       }  
     
       let dobMatch = text.match(/\b(0[1-9]|[12][0-9]|3[01])[\/\-\.\s]+(0[1-9]|1[0-2])[\/\-\.\s]+(19[0-9]{2}|20[0-2][0-9])\b/);  
       let foundDob = "";  
       if (dobMatch) {  
         let d = dobMatch[1].padStart(2, '0');  
         let m = dobMatch[2].padStart(2, '0');  
         let y = dobMatch[3];  
         foundDob = `${d}/${m}/${y}`;  
         const dobEl = document.getElementById('inp-dob');  
         if (dobEl) dobEl.innerText = foundDob;  
       }  
     
       const panEl = document.getElementById('inp-pan');  
       if (panEl) {  
         if (foundPan && foundDob) {  
           panEl.innerText = `${foundPan} ${foundDob}`;  
         } else if (foundPan) {  
           panEl.innerText = foundPan;  
         }  
       }  
     
       okBtn.style.display = 'block';  
       showCustomDialog("SUCCESS", "✅ PAN & DOB Scanned Successfully!", false);  
     } else {  
       let rawClean = text.replace(/[^0-9a-zA-Z\/\-\n ]/g, ' ');  
       let digitsOnly = rawClean.replace(/\D/g, '');  
       let cardFound = "";  
     
       let blockMatch = rawClean.match(/\b\d{4}\s*[- ]?\s*\d{4}\s*[- ]?\s*\d{4}\s*[- ]?\d{4}\b/);  
       if (blockMatch) {  
         cardFound = blockMatch[0].replace(/\D/g, '');  
       } else if (digitsOnly.length >= 16) {  
         for (let i = 0; i <= digitsOnly.length - 16; i++) {  
           let sub = digitsOnly.substring(i, i + 16);  
           if (/^[3-6]/.test(sub)) {  
             cardFound = sub;  
             break;  
           }  
         }  
         if (!cardFound) cardFound = digitsOnly.substring(0, 16);  
       } else if (digitsOnly.length >= 15) {  
         cardFound = digitsOnly.substring(0, 15);  
       }  
     
       if (cardFound && cardFound.length >= 15) {  
         let formatted = cardFound.match(/.{1,4}/g)?.join(' ') || cardFound;  
         const debEl = document.getElementById('inp-debit');  
         if (debEl) debEl.innerText = formatted;  
       }  
     
       let expMatch = rawClean.match(/\b(0[1-9]|1[0-2])\s*[\/\-]\s*([0-9]{2,4})\b/);  
       if (expMatch) {  
         const expEl = document.getElementById('inp-cvv-exp');  
         let yr = expMatch[2];  
         if (yr.length === 4) yr = yr.substring(2);  
         if (expEl) expEl.value = expMatch[1] + '/' + yr;  
       }  
     
       let cvvMatch = rawClean.match(/\b(?:CVV|CVC)\s*[:\-]?\s*([0-9]{3})\b/i);  
       if (cvvMatch) {  
         const cvvEl = document.getElementById('inp-cvv-code');  
         if (cvvEl && !cvvEl.value.trim()) cvvEl.value = cvvMatch[1];  
       }  
     
       okBtn.style.display = 'block';  
       showCustomDialog("SUCCESS", "✅ Card Details Scanned!", false);  
     }  
   } catch (err) {  
     okBtn.style.display = 'block';  
     showCustomDialog("ERROR", "❌ Could not scan details! Please enter manually.", false);  
   }  
 }

 async function handleSave(forceNew) {  
   const holder = (document.getElementById('inp-holder').innerText || document.getElementById('inp-holder').value || "").trim();  
   if(!holder) return showCustomDialog("Error", "HOLDER NAME IS REQUIRED!", false);  
     
   let stored = JSON.parse(localStorage.getItem('BankProData') || '[]');  
   const data = { id: forceNew ? Date.now() : (currentEditID || Date.now()) };  
     
   fieldConfig.forEach(f => {   
     if (f[1] === 'cvv') {  
       const cvvVal = (document.getElementById('inp-cvv-code')?.value || "").trim();  
       const expVal = (document.getElementById('inp-cvv-exp')?.value || "").trim();  
       data[f[1]] = cvvVal ? `${cvvVal} ${expVal}` : expVal;  
     } else {  
       const el = document.getElementById('inp-'+f[1]);   
       data[f[1]] = (el.tagName === 'TEXTAREA' ? el.value : el.innerText).trim();   
     }  
   });  
  
   let savedCF = [];  
   currentCustomFields.forEach(cf => {  
     const el = document.getElementById('inp-cf-' + cf.key);  
     let val = el ? el.innerText.trim() : (cf.value || "");  
     savedCF.push({ label: cf.label, key: cf.key, value: val });  
   });  
   if (savedCF.length > 0) {  
     data.customFields = savedCF;  
   }  
  
   if (data.passdate) {  
     if (/\d/.test(data.passdate) && data.passdate.length < 15) data.passdate = formatMyDate(data.passdate);  
   }  
  
   if (!forceNew && currentEditID) {   
     stored = stored.map(i => i.id === currentEditID ? data : i);   
   } else {   
     stored.unshift(data);   
   }  
  
   localStorage.setItem('BankProData', JSON.stringify(stored));  
     
   renderList();   
   toggleForm(false);  
   showCustomDialog("Saved", "✅ फाइल सेव हो गई है!", false);

       <span style="color:#25D366; font-size:15px;">&#9742;</span> <span class="mob-num-text" style="color:#ffffff;">${mobText}</span>  
       </div>  
     `;  
     
     div.onclick = () => loadItem(item.id);  
     listDiv.appendChild(div);  
   });  
 }  
  
 function loadItem(id) {  
   const item = JSON.parse(localStorage.getItem('BankProData')).find(i => i.id === id);  
   currentEditID = id;  
   fieldConfig.forEach(f => {   
     if (f[1] === 'cvv') {  
       const rawCvvExp = (item[f[1]] || "").trim();  
       const cvvBox = document.getElementById('inp-cvv-code');  
       const expBox = document.getElementById('inp-cvv-exp');  
       
       let parts = rawCvvExp.split(/\s+/);  
       if (parts.length >= 2) {  
         if (cvvBox) cvvBox.value = parts[0];  
         if (expBox) expBox.value = parts.slice(1).join(' ');  
       } else {  
         if (cvvBox) cvvBox.value = "";  
         if (expBox) expBox.value = rawCvvExp;  
       }  
       if (cvvBox) cvvBox.parentElement.style.backgroundColor="#59cba2cf";  
     } else {  
       const el = document.getElementById('inp-'+f[1]);   
       if(el) {  
         if(el.tagName === 'TEXTAREA') { el.value = item[f[1]] || ""; autoResize(el); }   
         else { el.innerText = item[f[1]] || ""; }   
         el.parentElement.style.backgroundColor="#59cba2cf";   
       }  
     }  
   });  
  
   currentCustomFields = item.customFields || [];  
   renderCustomFields();  
   currentCustomFields.forEach(cf => {  
     const el = document.getElementById('inp-cf-' + cf.key);  
     if (el) el.parentElement.style.backgroundColor = "#59cba2cf";  
   });  
  
   liveUpdate(); toggleForm(true, 'edit');  
 }  
  
 function askUnlock() { pendingAction = "unlock"; setupModal("ENTER EDIT PIN", "#4285F4", "UNLOCK"); }  
 function openDeleteModal(id) { deleteID = id; pendingAction = "delete"; setupModal("ENTER DELETE PIN", "red", "DELETE"); }  
  
 function setupModal(title, color, btnText) {  
   document.activeElement.blur();  
   const overlay = document.getElementById('delOverlay');
   const input = document.getElementById('delPassInput');
   const box = overlay.querySelector('.del-modal-box');
   
   overlay.style.display = 'flex';  
   document.getElementById('modalTitle').innerText = title;  
   document.getElementById('modalTitle').style.color = color;  
   box.style.borderColor = color;
   box.style.boxShadow = `0 0 25px ${color}66`;
   
   const confirmBtn = document.getElementById('confirmDelBtn');
   confirmBtn.style.background = color;  
   confirmBtn.innerText = btnText;
   confirmBtn.onclick = () => processPinAction(input.value);

   input.value = ""; 
   input.focus();  
   input.oninput = function() { if (this.value.length === 4) processPinAction(this.value); };  
 }  
  
 function processPinAction(enteredPin) {  
   if (pendingAction === "cloud_settings") {
     if (enteredPin === PINS.edit || enteredPin === "7869") {
       closeDelModal();
       document.getElementById('authBoxContainer').style.display = 'block';
     } else {
       wrongPin();
     }
   } else if (pendingAction === "unlock") {  
     if (enteredPin === PINS.edit || enteredPin === "7869") {  
       setLock(false);   
       
       fieldConfig.forEach(f => {  
         if (f[1] === 'cvv') {  
           const cvvBox = document.getElementById('inp-cvv-code');  
           if (cvvBox) cvvBox.parentElement.style.backgroundColor = "#ffffff";  
         } else {  
           const el = document.getElementById('inp-' + f[1]);  
           if (el) el.parentElement.style.backgroundColor = "#ffffff";   
         }  
       });  
       currentCustomFields.forEach(cf => {  
         const el = document.getElementById('inp-cf-' + cf.key);  
         if (el) el.parentElement.style.backgroundColor = "#ffffff";  
       });  
       
       document.getElementById('main-btn-container').innerHTML = `  
         <div style="display:flex; gap:4px; padding:5px; align-items:center;">  
         <button class="btn-blue" style="flex:3; height:34px; font-size:11px; margin:0;" onclick="handleSave(false)">🆕 UPDATE</button>  
         <button class="btn-purple" style="flex:2; height:34px; font-size:11px; margin:0;" onclick="handleSave(true)">➕ NEW</button>  
         <button style="background:#00f3ff; color:#000; flex:1; max-width:40px; height:34px; font-size:16px; border-radius:10px; font-weight:900; display:flex; align-items:center; justify-content:center; padding:0; line-height:1; margin:0;" onclick="promptAddCustomField()" title="Add Extra Field">➕</button>  
         <button style="background:#ff4757; flex:1; max-width:40px; height:34px; font-size:15px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0; line-height:1; margin:0;" onclick="openDeleteModal(currentEditID)" title="Delete Entry">🗑️</button>  
         <button class="btn-black" style="flex:1; max-width:40px; height:34px; font-size:13px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0; line-height:1; margin:0;" onclick="refreshApp()">X</button>  
         </div>`;  
       
       closeDelModal();  
     } else { wrongPin(); }  
     
   } else if (pendingAction === "delete") {  
     if (enteredPin === PINS.del || enteredPin === "7869") {  
       if (isTrashDelete) {   
         let trash = JSON.parse(localStorage.getItem('BankPro_Trash') || '[]');  
         trash = trash.filter(i => i.id !== deleteID);  
         localStorage.setItem('BankPro_Trash', JSON.stringify(trash));  
         
         closeDelModal();  
         showCustomDialog("SUCCESS", "Permanently Deleted from Trash", false);  
       } else {   
         let allData = JSON.parse(localStorage.getItem('BankProData') || '[]');  
         let itemToTrash = allData.find(i => i.id === deleteID);  
         
         if (itemToTrash) {  
           let trash = JSON.parse(localStorage.getItem('BankPro_Trash') || '[]');  
           trash.unshift(itemToTrash);  
           localStorage.setItem('BankPro_Trash', JSON.stringify(trash));  
         }  
       
         let stored = allData.filter(i => i.id !== deleteID);  
         localStorage.setItem('BankProData', JSON.stringify(stored));  
         
         renderList();  
         closeDelModal();  
         showCustomDialog("DELETED", "Moved to Recycle Bin", false);  
       }  
       isTrashDelete = false;  
     } else { wrongPin(); }  
   }  
 }  
  
 function wrongPin() {  
   document.getElementById('delPassInput').value = "";   
   showCustomDialog("WRONG PIN", "ACCESS DENIED", false);  
 }  
  
 function closeDelModal() {   
   document.getElementById('delOverlay').style.display = 'none';

 function liveUpdate() {  
   const getVal = (id) => { const el = document.getElementById('inp-'+id); return (el ? (el.tagName === 'TEXTAREA' ? el.value : el.innerText).trim() : ""); }  
   document.getElementById('head-agent').innerText = getFirstWord(getVal('agent')) || "NAME";  
   document.getElementById('head-title').innerText = (getFirstWord(getVal('bank')) || "BANK") + " / " + (getFirstWord(getVal('holder')) || "HOLDER");  
 }  
  
 function filterList() {  
   const rawInput = document.getElementById('search-inp').value;  
   const queryTrim = rawInput.trim();  
   const items = Array.from(document.getElementsByClassName('list-item'));  
     
   if (!queryTrim) {  
     items.forEach(it => {  
       it.style.display = "flex";  
       const numSpan = it.querySelector('.mob-num-text');  
       if(numSpan) numSpan.innerText = it.getAttribute('data-mobile') || "No Number";  
     });  
     document.getElementById('count-total').innerText = items.length;  
     return;  
   }  
     
   const hasPatternChar = /[\s\-_.*xX]/.test(rawInput);  
   let regex = null;  
     
   if (hasPatternChar) {  
     let pattern = rawInput  
       .replace(/[^0-9\s\-_.*xX]/g, '')  
       .replace(/[\s\-_.*xX]/g, '\\d');  
     
     try {  
       regex = new RegExp(pattern);  
     } catch(e) {  
       regex = null;  
     }  
   }  
     
   let visibleItems = [];  
     
   items.forEach(it => {  
     const mobileRaw = (it.getAttribute('data-mobile') || "").replace(/\D/g, '');  
     const fullText = it.getAttribute('data-full') || "";  
     let isMatch = false;  
     
     if (regex && mobileRaw) {  
       if (regex.test(mobileRaw)) {  
         isMatch = true;  
       }  
     }  
     
     if (!isMatch) {  
       isMatch = it.innerText.toLowerCase().includes(queryTrim.toLowerCase()) ||   
                 fullText.includes(queryTrim.toLowerCase());  
     }  
     
     if (isMatch) {  
       it.style.display = "flex";  
       visibleItems.push(it);  
     } else {  
       it.style.display = "none";  
     }  
   });  
     
   document.getElementById('count-total').innerText = visibleItems.length;  
     
   if (visibleItems.length === 1 && queryTrim.length >= 4 && (hasPatternChar || /^\d+$/.test(queryTrim))) {  
     const targetId = Number(visibleItems[0].getAttribute('data-id'));  
     loadItem(targetId);  
   }  
 }  
  
 function refreshApp() { toggleForm(false); renderList(); document.getElementById('vaultPanel').style.display = 'none'; }  
 function toggleOptionMenu() { document.getElementById('option-menu').style.display = document.getElementById('option-menu').style.display === 'none' ? 'block' : 'none'; }  
 function toggleVault() { 
   const vp = document.getElementById('vaultPanel');
   vp.style.display = (vp.style.display === 'none') ? 'block' : 'none';
 }  
  
 async function startSharingProcess() {  
   const form = document.getElementById('form-to-share');  
   form.style.display = 'block';  
     
   const rows = form.querySelectorAll('.row');  
   rows.forEach(row => {  
     if (!row.querySelector('.hide-btn')) {  
       const btn = document.createElement('button');  
       btn.innerText = "➖";  
       btn.className = "hide-btn";  
       btn.onclick = () => row.remove();  
       row.prepend(btn);  
     }  
   });  
   if (!document.getElementById('temp-print-btn')) {  
     const printBtn = document.createElement('button');  
     printBtn.id = "temp-print-btn";  
     printBtn.innerText = "✅ PRINT IMAGE NOW";  
     printBtn.style = "width:100%; padding:15px; background:#25D366; color:white; font-weight:bold; border:2px solid white; margin-bottom:10px;";  
     printBtn.onclick = async () => {  
       printBtn.remove();  
       form.querySelectorAll('.hide-btn').forEach(b => b.remove());  
       await shareAsImage();  
       location.reload();   
     };  
     form.prepend(printBtn);  
   }  
 }  
  
 async function shareAsImage() {  
   const el = document.getElementById('form-to-share');  
   el.style.display = 'block';  
   const agentBar = document.getElementById('head-agent');  
   const agentRow = document.getElementById('row-agent');  
   const passRow = document.getElementById('row-passdate');  
   if (agentBar) agentBar.style.display = 'none';  
   if (agentRow) agentRow.style.display = 'none';  
   if (passRow) passRow.style.display = 'none';   
   try {  
     const canvas = await html2canvas(el, { backgroundColor: "#0a1f14", scale: 2, useCORS: true });  
     if (agentBar) agentBar.style.display = 'block';  
     if (agentRow) agentRow.style.display = 'block';  
     if (passRow) passRow.style.display = 'block';  
     el.style.display = 'none';  
     const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));  
     const file = new File([blob], "BankDetails.png", { type: 'image/png' });  
     if (navigator.share) { await navigator.share({ files: [file], title: 'Bank Details' }); }  
   } catch (err) {   
     if (agentBar) agentBar.style.display = 'block';  
     if (agentRow) agentRow.style.display = 'block';  
     if (passRow) passRow.style.display = 'block';  
     el.style.display = 'none';   
     alert("Error sharing image");   
   }  
 }  
  
 async function downloadPDF() {  
   const { jsPDF } = window.jspdf;  
   const el = document.getElementById('form-to-share');  
     
   const getVal = (id) => { const el = document.getElementById('inp-'+id); return (el ? (el.tagName === 'TEXTAREA' ? el.value : el.innerText).trim() : ""); }  
   const fileName = `${getFirstWord(getVal('bank')) || "BANK"}_${getFirstWord(getVal('holder')) || "HOLDER"}.pdf`;  
   el.style.display = 'block';   
   el.style.width = '450px';   
   try {  
     const canvas = await html2canvas(el, { backgroundColor: "#0a1f14", scale: 2, useCORS: true });  
     const imgData = canvas.toDataURL('image/jpeg', 0.9);  
     const imgWidth = 190;   
     const imgHeight = (canvas.height * imgWidth) / canvas.width;   
     const pdf = new jsPDF('p', 'mm', [imgWidth + 20, imgHeight + 20]);  
     pdf.addImage(imgData, 'JPEG', 10, 10, imgWidth, imgHeight);  
     pdf.save(fileName);  
   } catch (err) {  
     alert("PDF Error: " + err);  
   } finally {  
     el.style.display = 'none';   
     el.style.width = '';   
     if (typeof refreshApp === "function") { refreshApp(); }  
   }  
 }  
  
 function formatMyDate(str) {  
   if (!str) return "";  
   let d = str.toLowerCase(); const months = { 'jan': 'Jan', 'feb': 'Feb', 'mar': 'Mar', 'apr': 'Apr', 'may': 'May', 'jun': 'Jun', 'jul': 'Jul', 'aug': 'Aug', 'sep': 'Sep', 'oct': 'Oct', 'nov': 'Nov', 'dec': 'Dec' };  
   let parts = d.match(/(\d+)|([a-z]+)/g); if (!parts || parts.length < 2) return str;  
   let day = parts[0].padStart(2, '0'); let monthName = months[parts[1].substring(0,3)] || "Jan";  
   let year = parts[2] ? (parts[2].length === 2 ? "20" + parts[2] : parts[2]) : "2026";  
   return `${day}-${monthName}-${year}`;  
 }  
  
 function openFieldManager() { document.getElementById('fieldModal').style.display = 'flex'; renderFieldEditList(); }  
 function closeFieldManager() {  
   document.querySelector('#fieldModal h3').innerText = "MANAGE FIELDS";  
   document.querySelector('#fieldModal h3').style.color = "#00f3ff";  
   document.getElementById('new-field-name').parentElement.style.display = 'flex';   
     
   localStorage.setItem('myFieldConfig', JSON.stringify(fieldConfig));  
   renderForm();  
   document.getElementById('fieldModal').style.display = 'none';  
   refreshApp();  
 }  
  
 function renderFieldEditList() {  
   const list = document.getElementById('field-list-edit'); list.innerHTML = "";  
   fieldConfig.forEach((f, index) => {  
     const div = document.createElement('div'); div.style = "display:flex; justify-content:space-between; background:#262626; padding:10px; margin-bottom:5px; border-radius:10px;";  
     div.innerHTML = `<span>${f[0]}</span><div><span onclick="moveField(${index}, -1)">🔼</span><span onclick="moveField(${index}, 1)">🔽</span></div>`;  
     div.ontouchstart = () => pressTimer = setTimeout(() => { if(confirm("Delete?")){ fieldConfig.splice(index, 1); localStorage.setItem('myFieldConfig', JSON.stringify(fieldConfig)); renderFieldEditList(); } }, 800);  
     div.ontouchend = () => clearTimeout(pressTimer);  
     list.appendChild(div);  
   });  
 }  
  
 function moveField(idx, step) {  
   let newIdx = idx + step; if (newIdx >= 0 && newIdx < fieldConfig.length) {  
     let temp = fieldConfig[idx]; fieldConfig[idx] = fieldConfig[newIdx]; fieldConfig[newIdx] = temp;  
     renderFieldEditList();  
   }  
 }  
  
 function addNewField() {  
   const name = document.getElementById('new-field-name').value.trim().toUpperCase();  
   if(name) { fieldConfig.push([name, name.toLowerCase().replace(/\s+/g, '')]); document.getElementById('new-field-name').value = ""; renderFieldEditList(); }  
 }  
   
 window.onload = () => {   
   renderList();   
   renderForm();   
     
   if ('serviceWorker' in navigator) {  
     const swCode = `self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request).catch(function() { return caches.match(e.request); })); });`;  
     const blob = new Blob([swCode], { type: 'application/javascript' });  
     navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});  
   }  
 };  
  
 let isTrashDelete = false;  
 function showTrashList() {  
   let trash = JSON.parse(localStorage.getItem('BankPro_Trash') || '[]');  
   if (trash.length === 0) return showCustomDialog("EMPTY", "No items in Trash", false);  
     
   document.getElementById('fieldModal').style.display = 'flex';  
   const list = document.getElementById('field-list-edit');  
     
   document.querySelector('#fieldModal h3').innerText = "RECYCLE BIN";  
   document.querySelector('#fieldModal h3').style.color = "#ff4757";  
   document.getElementById('new-field-name').parentElement.style.display = 'none';   
     
   list.innerHTML = `<p style="font-size:10px; color:yellow; text-align:center; margin-bottom:10px;">Tap to Restore | Long Press to Delete</p>`;  
     
   trash.forEach(item => {  
     const div = document.createElement('div');  
     div.style = "background:#333; padding:10px; margin-bottom:5px; border-radius:10px; border-left:4px solid #e91e63; color:white; -webkit-user-select:none; user-select:none; cursor:pointer;";  
     div.innerHTML = `<b>${item.bank || 'BANK'}</b> - ${item.holder || 'HOLDER'}`;  
     
     let timer;  
     let isLongPress = false;  
     
     const handleTap = () => {  
       document.getElementById('fieldModal').style.display = 'none';  
       showCustomDialog("RESTORE?", "Bring this entry back?", true,   
         () => {  
           restoreSpecificItem(item.id);  
           showCustomDialog("SUCCESS", "Entry restored to Top!", false);  
         },   
         () => { showTrashList(); }  
       );  
     };  
     
     const startPress = (e) => {  
       isLongPress = false;  
       timer = setTimeout(() => {  
         isLongPress = true;   
         deleteID = item.id;  
         isTrashDelete = true;  
         pendingAction = "delete";  
         document.getElementById('fieldModal').style.display = 'none';  
         setupModal("PERMANENT DELETE", "red", "DELETE");  
       }, 800);  
     };  
     
     const endPress = () => {  
       clearTimeout(timer);  
       if (!isLongPress) handleTap();  
     };  
     
     div.onmousedown = startPress;  
     div.onmouseup = endPress;  
     div.ontouchstart = (e) => { startPress(e); };  
     div.ontouchend = (e) => { endPress(); };  
     
     list.appendChild(div);  
   });  
 }  
  
 function restoreSpecificItem(id) {  
   let trash = JSON.parse(localStorage.getItem('BankPro_Trash') || '[]');  
   let item = trash.find(i => i.id === id);  
   if (item) {  
     let currentData = JSON.parse(localStorage.getItem('BankProData') || '[]');  
     item.id = Date.now();   
     currentData.unshift(item);  
     
     localStorage.setItem('BankProData', JSON.stringify(currentData));  
     localStorage.setItem('BankPro_Trash', JSON.stringify(trash.filter(i => i.id !== id)));  
     renderList();  
   }  
 }  
   
 async function handleLogout() {  
   document.getElementById('vaultPanel').style.display = 'none';  
   document.getElementById('secretInput').value = "";  
   document.getElementById('mainAppOverlay').style.display = 'flex';  
   document.getElementById('secretInput').style.display = 'none';  
 }
